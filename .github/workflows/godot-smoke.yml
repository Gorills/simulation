name: Godot smoke

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: godot-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "true"
      WORLD_SIM_GODOT_IMPORT_DISPLAY: "1"
      WORLD_SIM_GODOT_IMPORT_ONCE: "1"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-dev.txt
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: godot-smoke-ccache-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'CMakePresets.json') }}
          restore-keys: |
            godot-smoke-ccache-${{ runner.os }}-
      - name: Ensure compiler cache and virtual display
        shell: bash
        run: |
          missing=()
          command -v ccache >/dev/null 2>&1 || missing+=(ccache)
          command -v xvfb-run >/dev/null 2>&1 || missing+=(xvfb)
          command -v xauth >/dev/null 2>&1 || missing+=(xauth)
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          ccache --set-config=max_size=750M
          ccache --set-config=compression=true
          ccache --zero-stats
      - name: Install pinned Godot
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import subprocess
          import urllib.request
          import zipfile

          lock = json.loads(Path("tools/toolchain.lock.json").read_text(encoding="utf-8"))
          version = lock.get("godot")
          if not isinstance(version, str) or not version:
              raise SystemExit("tools/toolchain.lock.json is missing a valid Godot version")

          release = f"{version}-stable"
          binary_name = f"Godot_v{release}_linux.x86_64"
          tools = Path(".tools")
          tools.mkdir(exist_ok=True)
          archive = tools / "godot.zip"
          binary = tools / binary_name
          url = f"https://github.com/godotengine/godot/releases/download/{release}/{binary_name}.zip"

          urllib.request.urlretrieve(url, archive)
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(tools)
          archive.unlink()
          binary.chmod(0o755)
          subprocess.run([str(binary), "--version"], check=True)

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"GODOT_BIN={binary.resolve()}\n")
          PY
      - name: Build smoke graph
        run: |
          cmake --preset smoke-ci -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset smoke-ci
          python tools/check_localization.py
          ccache --show-stats
      - name: Verify reciprocal aid Godot bridge branches
        run: xvfb-run -a "$GODOT_BIN" --headless --path godot --script res://scripts/playtest/m3_reciprocal_aid_bridge_test.gd
      - name: Verify Russian Godot smoke
        run: xvfb-run -a python tools/dev.py play --scenario smoke --locale ru
      - name: Verify English Godot smoke
        run: xvfb-run -a python tools/dev.py play --scenario smoke --locale en
      - name: Verify Russian autonomous shortage
        run: xvfb-run -a python tools/dev.py play --scenario shortage --locale ru
      - name: Verify English autonomous shortage
        run: xvfb-run -a python tools/dev.py play --scenario shortage --locale en
      - name: Verify Russian Gift vertical
        run: xvfb-run -a python tools/dev.py play --scenario gift --locale ru
      - name: Verify English Gift vertical
        run: xvfb-run -a python tools/dev.py play --scenario gift --locale en
      - name: Verify Russian Work vertical
        run: xvfb-run -a python tools/dev.py play --scenario work --locale ru
      - name: Verify English Work vertical
        run: xvfb-run -a python tools/dev.py play --scenario work --locale en
      - name: Verify Russian household transfer
        run: xvfb-run -a python tools/dev.py play --scenario transfer --locale ru
      - name: Verify English household transfer
        run: xvfb-run -a python tools/dev.py play --scenario transfer --locale en
      - name: Verify offscreen continuation
        run: xvfb-run -a python tools/dev.py play --scenario offscreen --locale ru
      - name: Verify rest interference loop
        run: xvfb-run -a python tools/dev.py play --scenario rest_interference --locale ru
      - name: Upload Godot smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-smoke-${{ github.sha }}
          path: .cache/play/**
          if-no-files-found: warn