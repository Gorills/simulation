name: Native verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset:
          - native
          - sanitize

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-dev.txt
      - name: Configure, build, and test
        run: python tools/dev.py check --preset "${{ matrix.preset }}"
